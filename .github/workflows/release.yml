# Al subir una etiqueta vX.Y.Z: compila el .deb y el .rpm en Ubuntu 24.04 (glibc 2.39, para
# que instalen también en sistemas no tan nuevos), los instaladores de Windows (.exe de Inno
# Setup para el usuario y .msi de WiX para todo el equipo) y la app de macOS (universal, en un
# .dmg y en un .app.tar.gz), y publica la versión con las notas de la sección `## vX.Y.Z` del
# CHANGELOG y un SHA256SUMS.
#
# Los nombres siguen el esquema que entiende iureapps (`IureVoz-<ver>-linux-x64.deb`,
# `-linux-x64.rpm`, `-windows-x64.exe`, `-macos-universal.app.tar.gz`): si se cambian, hay que
# cambiar su catálogo.
#
# macOS: con los secrets de Apple (los mismos que iureapps; se cargan con su
# `scripts/apple-secrets.sh` y `REPO=ellaguno/iurevoz`) la app se firma con Developer ID y se
# notariza; sin ellos se firma «ad hoc» y avisa: abre con clic derecho → Abrir (o instalada
# con iureapps), pero macOS vuelve a pedir los permisos en cada versión.
#
# Windows también arma el paquete MSIX para Microsoft Store (artefactos `msix-store`, sin
# firmar, para Partner Center, y `msix-prueba`, firmado con un certificado de prueba); no va a
# la release. Ver «Microsoft Store (MSIX)» en el README.
#
# A mano (Actions → Release → Run workflow) compila todo sin publicar nada: los
# paquetes quedan como artefactos de la ejecución, para probar una rama.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: La etiqueta coincide con Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Cargo.toml dice $v y la etiqueta $GITHUB_REF_NAME"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --release --locked

      - name: Paquetes .deb y .rpm
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cargo install cargo-deb cargo-generate-rpm --locked
          mkdir -p target/paquetes
          cargo deb --no-build -o "target/paquetes/IureVoz-$v-linux-x64.deb"
          cargo generate-rpm -o "target/paquetes/IureVoz-$v-linux-x64.rpm"
          ls -la target/paquetes

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: target/paquetes/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --release --locked

      - name: Pruebas
        run: cargo test --release --locked

      - name: Instaladores .exe y .msi, y .zip
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DVersion=$v" packaging\iurevoz.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tool install --global wix --version 5.0.2
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" build -arch x64 -d "Version=$v" -o "target\instalador\IureVoz-$v-windows-x64.msi" packaging\iurevoz.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item target\instalador\*.wixpdb -ErrorAction SilentlyContinue
          Compress-Archive -Path target\release\iurevoz.exe, README.md, LICENSE.md -DestinationPath "target\instalador\IureVoz-$v-windows-x64.zip"
          Get-ChildItem target\instalador

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/instalador/*

      # Paquete para Microsoft Store (la Store lo firma), con lo mismo que instala el .exe de
      # Inno Setup (iurevoz.exe, README.md, LICENSE.md). La identidad sale de Partner Center
      # (Identidad del producto) y va en variables del repo; sin ellas se usan valores de prueba.
      # Además, una copia firmada con un certificado de prueba que se instala, se prueba y se
      # desinstala aquí mismo. Ninguno de los dos va a la release.
      - name: Paquete MSIX (Microsoft Store)
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:MSIX_IDENTITY_NAME -or -not $env:MSIX_PUBLISHER -or -not $env:MSIX_PUBLISHER_DISPLAY_NAME) {
            Write-Output "::warning::Faltan las variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER o MSIX_PUBLISHER_DISPLAY_NAME: el .msix lleva una identidad de prueba y Partner Center lo rechazará."
          }
          $identity = if ($env:MSIX_IDENTITY_NAME) { $env:MSIX_IDENTITY_NAME } else { 'Iurefficient.IureVoz' }
          $publisher = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { 'CN=Iurefficient' }
          $display = if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $env:MSIX_PUBLISHER_DISPLAY_NAME } else { 'Iurefficient' }
          # La Store no acepta un primer número 0 y exige el cuarto en 0: 0.4.0 → 1.4.0.0
          # (el mismo esquema que iureapps e IureProject). Siempre crece; la 1.0.0 será 2.0.0.0.
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $parts = ($cargo -replace '-.*$', '').Split('.')
          $version = "$([int]$parts[0] + 1).$($parts[1]).$($parts[2]).0"
          Write-Output "Versión del paquete: $version"
          # Los valores van dentro de atributos XML.
          $identityXml = [System.Security.SecurityElement]::Escape($identity)
          $publisherXml = [System.Security.SecurityElement]::Escape($publisher)
          $displayXml = [System.Security.SecurityElement]::Escape($display)

          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^10\.' -and (Test-Path "$($_.FullName)\x64\makeappx.exe") } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $tools = "$($sdk.FullName)\x64"
          Write-Output "Windows SDK: $tools"

          $root = 'msix\paquete'
          New-Item -ItemType Directory -Force $root, msix\store, msix\prueba | Out-Null
          Copy-Item -Recurse packaging\msix\Assets "$root\Assets"
          Copy-Item target\release\iurevoz.exe, README.md, LICENSE.md $root
          $manifest = Get-Content packaging\msix\AppxManifest.xml -Raw
          $manifest = $manifest.Replace('@IDENTITY_NAME@', $identityXml).Replace('@PUBLISHER@', $publisherXml)
          $manifest = $manifest.Replace('@PUBLISHER_DISPLAY_NAME@', $displayXml).Replace('@VERSION@', $version)
          Set-Content "$root\AppxManifest.xml" $manifest -Encoding utf8

          # resources.pri: elige los íconos sin fondo (altform-unplated) de la barra de tareas.
          & "$tools\makepri.exe" createconfig /cf msix\priconfig.xml /dq es-MX /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$tools\makepri.exe" new /pr $root /cf msix\priconfig.xml /mn "$root\AppxManifest.xml" /of "$root\resources.pri" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msix = "IureVoz-$cargo-windows-x64.msix"
          & "$tools\makeappx.exe" pack /d $root /p "msix\store\$msix" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Copia de prueba: certificado autofirmado con el mismo Publisher.
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName 'IureVoz (prueba)' -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pass = ConvertTo-SecureString -String 'prueba' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath msix\prueba.pfx -Password $pass | Out-Null
          Export-Certificate -Cert $cert -FilePath msix\prueba\IureVoz-prueba.cer | Out-Null
          $prueba = "msix\prueba\IureVoz-$cargo-windows-x64-prueba.msix"
          Copy-Item "msix\store\$msix" $prueba
          & "$tools\signtool.exe" sign /fd SHA256 /f msix\prueba.pfx /p prueba $prueba
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item msix\prueba.pfx

          # Prueba: instalar la copia firmada y, dentro del paquete (por el alias `iurevoz`):
          # la versión, la StartupTask (apagada → encender → apagar) y abrir la ventana.
          Import-Certificate -FilePath msix\prueba\IureVoz-prueba.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path $prueba
          $pkg = Get-AppxPackage | Where-Object { $_.Name -eq $identity } | Select-Object -First 1
          Write-Output "Instalado: $($pkg.PackageFullName)"
          $alias = "$env:LOCALAPPDATA\Microsoft\WindowsApps\iurevoz.exe"
          # iurevoz.exe es de subsistema «windows»: con la salida redirigida a un archivo escribe ahí
          function Iurevoz([string[]]$argumentos) {
            $out = Join-Path $env:RUNNER_TEMP 'iurevoz-salida.txt'
            $err = Join-Path $env:RUNNER_TEMP 'iurevoz-error.txt'
            $p = Start-Process -FilePath $alias -ArgumentList $argumentos -NoNewWindow -PassThru `
              -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $p.WaitForExit(60000)) { $p.Kill(); return "(no terminó en 60 s)" }
            $texto = ("$(Get-Content $out -Raw)" + "$(Get-Content $err -Raw)").Trim()
            Write-Output "iurevoz $($argumentos -join ' ') → [$($p.ExitCode)] $texto"
          }
          $fallas = @()
          $r = Iurevoz @('--version'); Write-Output $r
          if ("$r" -notmatch [regex]::Escape("iurevoz $cargo")) { $fallas += 'la versión no respondió dentro del paquete' }
          $r = Iurevoz @('inicio'); Write-Output $r
          if ("$r" -notmatch 'StartupTask del paquete: inactivo') { $fallas += 'la StartupTask no empieza apagada' }
          $r = Iurevoz @('inicio', 'si'); Write-Output $r
          if ("$r" -notmatch 'StartupTask del paquete: activo') { $fallas += 'no se pudo encender la StartupTask' }
          $r = Iurevoz @('inicio', 'no'); Write-Output $r
          if ("$r" -notmatch 'StartupTask del paquete: inactivo') { $fallas += 'no se pudo apagar la StartupTask' }
          # La ventana: se abre como desde el menú Inicio y debe seguir viva a los 15 s.
          Start-Process explorer.exe "shell:AppsFolder\$($pkg.PackageFamilyName)!IureVoz"
          Start-Sleep -Seconds 15
          $vivo = Get-Process iurevoz -ErrorAction SilentlyContinue
          if ($vivo) {
            Write-Output "La ventana sigue abierta: $($vivo.Path)"
            $vivo | Stop-Process -Force
          } else {
            Write-Output "::warning::IureVoz no siguió abierto 15 s después de abrirlo desde el paquete (puede ser el runner sin escritorio)"
          }
          Start-Sleep -Seconds 2
          Remove-AppxPackage -Package $pkg.PackageFullName
          if ($fallas) { $fallas | ForEach-Object { Write-Output "::error::MSIX: $_" }; exit 1 }
          Get-ChildItem msix\store, msix\prueba

      - name: Subir el MSIX para la Store
        uses: actions/upload-artifact@v7
        with:
          name: msix-store
          path: msix/store/*

      - name: Subir el MSIX de prueba
        uses: actions/upload-artifact@v7
        with:
          name: msix-prueba
          path: msix/prueba/*

  macos:
    runs-on: macos-latest
    timeout-minutes: 160
    env:
      APP: IureVoz.app
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Compilar (arm64 + x86_64) y unir con lipo
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p build
          lipo -create -output build/iurevoz \
            target/aarch64-apple-darwin/release/iurevoz target/x86_64-apple-darwin/release/iurevoz
          lipo -info build/iurevoz

      - name: Pruebas
        run: cargo test --release --locked --target aarch64-apple-darwin

      - name: Armar IureVoz.app
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          app="build/$APP"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp build/iurevoz "$app/Contents/MacOS/iurevoz"
          sed -e "s/@VERSION@/$v/" -e "s/@BUILD@/${{ github.run_number }}/" \
            packaging/macos/Info.plist > "$app/Contents/Info.plist"
          printf 'APPL????' > "$app/Contents/PkgInfo"
          plutil -lint "$app/Contents/Info.plist"
          cp packaging/macos/iurevoz.icns "$app/Contents/Resources/iurevoz.icns"
          cp README.md LICENSE.md "$app/Contents/Resources/"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Llavero temporal con el certificado Developer ID
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          for v in P12_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD TEAM_ID ASC_PRIVATE_KEY ASC_KEY_ID ASC_ISSUER_ID; do
            if [[ -z "${!v}" ]]; then
              echo "::warning::Falta el secret de $v: la app se firma «ad hoc», sin notarizar"
              exit 0
            fi
          done
          kc="$RUNNER_TEMP/firma.keychain-db"
          p12="$RUNNER_TEMP/devid.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          security import "$p12" -k "$kc" -P "$P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          # intermedio de Developer ID (G2), por si el runner no lo trae
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/g2.cer"
          security import "$RUNNER_TEMP/g2.cer" -k "$kc" 2>/dev/null || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$kc" >/dev/null
          # shellcheck disable=SC2046  # una ruta por llavero
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$kc" |
            grep "Developer ID Application" | grep "($TEAM_ID)" | head -1 | awk '{print $2}')
          [[ -n "$identity" ]] || { security find-identity -v -p codesigning "$kc"; echo "::error::No hay identidad Developer ID Application del equipo"; exit 1; }
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          {
            echo "KEYCHAIN=$kc"
            echo "IDENTITY=$identity"
            echo "ASC_KEY_PATH=$key"
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Firmar la app
        run: |
          if [[ -n "${IDENTITY:-}" ]]; then
            # Developer ID con «hardened runtime»: el micrófono va en los entitlements
            codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" \
              --entitlements packaging/macos/iurevoz.entitlements "build/$APP"
          else
            codesign --force --sign - --entitlements packaging/macos/iurevoz.entitlements "build/$APP"
          fi
          codesign --verify --strict --deep --verbose=2 "build/$APP"
          codesign -dvv "build/$APP" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier|flags|Timestamp' || true

      - name: .dmg (firmado y notarizado, si hay secrets) y .app.tar.gz
        run: |
          mkdir -p dist build/dmg
          dmg="dist/IureVoz-$VERSION-macos-universal.dmg"
          ditto "build/$APP" "build/dmg/$APP"
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "IureVoz $VERSION" -srcfolder build/dmg -fs HFS+ -format UDZO -ov "$dmg"
          if [[ -n "${IDENTITY:-}" ]]; then
            codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$dmg"
            # un solo envío: el ticket del .dmg cubre también la app que lleva dentro
            out=$(xcrun notarytool submit "$dmg" --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" \
              --issuer "$ASC_ISSUER_ID" --wait --timeout 2h --output-format json) || true
            echo "$out"
            id=$(echo "$out" | plutil -extract id raw -o - - 2>/dev/null || true)
            status=$(echo "$out" | plutil -extract status raw -o - - 2>/dev/null || true)
            if [[ "$status" != Accepted ]]; then
              [[ -n "$id" ]] && xcrun notarytool log "$id" --key "$ASC_KEY_PATH" \
                --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
              echo "::error::Notarización del .dmg: ${status:-sin respuesta de Apple (envío $id)}"
              exit 1
            fi
            xcrun stapler staple "$dmg"
            # la app suelta (la que instala iureapps) lleva su propio ticket
            xcrun stapler staple "build/$APP"
            spctl --assess --type execute --verbose=4 "build/$APP"
          fi
          # sin metadatos de Finder (._*): iureapps la extrae con tar
          COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "dist/IureVoz-$VERSION-macos-universal.app.tar.gz" -C build "$APP"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

      - name: Limpiar llavero y llave
        if: always()
        run: |
          [[ -n "${KEYCHAIN:-}" ]] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/devid.p12

  publicar:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: paquetes
          # los MSIX (msix-*) no van a la release
          pattern: '{linux,windows,macos}'
          merge-multiple: true

      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd paquetes && sha256sum * > SHA256SUMS)
          awk -v t="## $GITHUB_REF_NAME" 'index($0, t) == 1 {f=1; next} /^## v/ {f=0} f' CHANGELOG.md > notas.md
          gh release create "$GITHUB_REF_NAME" paquetes/* \
            --title "IureVoz ${GITHUB_REF_NAME#v}" --notes-file notas.md
