# Al subir una etiqueta vX.Y.Z: compila el .deb en Ubuntu 24.04 (glibc 2.39, para que
# instale también en sistemas no tan nuevos) y el instalador de Windows, y publica la
# versión con las notas de la sección `## vX.Y.Z` del CHANGELOG.
#
# A mano (Actions → Release → Run workflow) compila los dos sin publicar nada: los
# paquetes quedan como artefactos de la ejecución, para probar una rama.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: La etiqueta coincide con Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Cargo.toml dice $v y la etiqueta $GITHUB_REF_NAME"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --release --locked

      - name: Paquete .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build
          ls -la target/debian

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: target/debian/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --release --locked

      - name: Pruebas
        run: cargo test --release --locked

      - name: Instalador y .zip
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DVersion=$v" packaging\iurevoz.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path target\release\iurevoz.exe, README.md -DestinationPath "target\instalador\IureVoz-$v-windows-x64.zip"
          Get-ChildItem target\instalador

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/instalador/*

  publicar:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [deb, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: paquetes
          merge-multiple: true

      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v t="## $GITHUB_REF_NAME" 'index($0, t) == 1 {f=1; next} /^## v/ {f=0} f' CHANGELOG.md > notas.md
          gh release create "$GITHUB_REF_NAME" paquetes/* \
            --title "IureVoz ${GITHUB_REF_NAME#v}" --notes-file notas.md
