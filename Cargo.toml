[package]
name = "iurevoz"
version = "0.4.0"
edition = "2024"
description = "Dictado y órdenes por voz para Linux (GNOME), Windows y macOS, local; parte de la suite Iurefficient"
license = "Apache-2.0"
authors = ["Eduardo Llaguno <eduardo@llaguno.com>"]
homepage = "https://github.com/ellaguno/iurevoz"

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
candle-core = "0.11"
candle-nn = "0.11"
chrono = "0.4.45"
# mismo reqwest que iurefficient-connect: para PUT con su `Session::request`
reqwest = { version = "0.12", default-features = false, features = ["json"] }
cpal = "0.18"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
eframe = "0.37"
evalexpr = "13.1.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
iurefficient-connect = { git = "https://github.com/ellaguno/iurefficient-connect", tag = "v0.7.1", version = "0.7.1", default-features = false }
rand = "0.10"
rustfft = "6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sherpa-onnx = "1.13.8"
tar = "0.4.46"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1.8"
ureq = { version = "3.4.2", features = ["json"] }

# Linux (GNOME/Wayland): portales, distribución de teclado e ícono StatusNotifierItem
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "global_shortcuts"] }
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
xkbcommon = { version = "0.9.0", default-features = false }

# Linux y macOS: getrusage y redirigir la salida al registro
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# macOS: teclear con CGEvent (FFI en portal_macos.rs), atajos de Carbon, ícono en la barra de
# menús y llavero; NSApplication para esconder y mostrar la ventana
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
global-hotkey = "0.7"
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
tray-icon = "0.21"

# Windows: SendInput, RegisterHotKey, Job Objects, volumen, portapapeles y avisos con Win32/WinRT
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
tray-icon = "0.21"
uds_windows = "1.2.1"
zip = { version = "8", default-features = false, features = ["deflate"] }
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# ícono de iurevoz.exe (build.rs)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# `cargo deb`: paquete para Ubuntu/Debian (los modelos se descargan al primer uso)
[package.metadata.deb]
maintainer = "Eduardo Llaguno <eduardo@llaguno.com>"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """\
IureVoz dicta en cualquier ventana y entiende órdenes por voz. El reconocimiento \
corre en el equipo (Nemotron o Moonshine con sherpa-onnx); las órdenes usan un LLM \
local o el que se configure. Requiere GNOME en Wayland (portal RemoteDesktop)."""
assets = [
    ["target/release/iurevoz", "usr/bin/", "755"],
    ["packaging/mx.iurefficient.IureVoz.desktop", "usr/share/applications/", "644"],
    ["packaging/icono/png/16.png", "usr/share/icons/hicolor/16x16/apps/mx.iurefficient.IureVoz.png", "644"],
    ["packaging/icono/png/24.png", "usr/share/icons/hicolor/24x24/apps/mx.iurefficient.IureVoz.png", "644"],
    ["packaging/icono/png/32.png", "usr/share/icons/hicolor/32x32/apps/mx.iurefficient.IureVoz.png", "644"],
    ["packaging/icono/png/48.png", "usr/share/icons/hicolor/48x48/apps/mx.iurefficient.IureVoz.png", "644"],
    ["packaging/icono/png/64.png", "usr/share/icons/hicolor/64x64/apps/mx.iurefficient.IureVoz.png", "644"],
    ["packaging/icono/png/128.png", "usr/share/icons/hicolor/128x128/apps/mx.iurefficient.IureVoz.png", "644"],
    ["packaging/icono/png/256.png", "usr/share/icons/hicolor/256x256/apps/mx.iurefficient.IureVoz.png", "644"],
    ["packaging/icono/png/512.png", "usr/share/icons/hicolor/512x512/apps/mx.iurefficient.IureVoz.png", "644"],
    ["packaging/icono/iurevoz.svg", "usr/share/icons/hicolor/scalable/apps/mx.iurefficient.IureVoz.svg", "644"],
    ["README.md", "usr/share/doc/iurevoz/README.md", "644"],
    ["LICENSE.md", "usr/share/doc/iurevoz/copyright", "644"],
]

# `cargo generate-rpm`: paquete para Fedora/openSUSE, con lo mismo que el .deb
[package.metadata.generate-rpm]
summary = "Dictado y órdenes por voz, local"
auto-req = "builtin"
assets = [
    { source = "target/release/iurevoz", dest = "/usr/bin/iurevoz", mode = "755" },
    { source = "packaging/mx.iurefficient.IureVoz.desktop", dest = "/usr/share/applications/mx.iurefficient.IureVoz.desktop", mode = "644" },
    { source = "packaging/icono/png/16.png", dest = "/usr/share/icons/hicolor/16x16/apps/mx.iurefficient.IureVoz.png", mode = "644" },
    { source = "packaging/icono/png/24.png", dest = "/usr/share/icons/hicolor/24x24/apps/mx.iurefficient.IureVoz.png", mode = "644" },
    { source = "packaging/icono/png/32.png", dest = "/usr/share/icons/hicolor/32x32/apps/mx.iurefficient.IureVoz.png", mode = "644" },
    { source = "packaging/icono/png/48.png", dest = "/usr/share/icons/hicolor/48x48/apps/mx.iurefficient.IureVoz.png", mode = "644" },
    { source = "packaging/icono/png/64.png", dest = "/usr/share/icons/hicolor/64x64/apps/mx.iurefficient.IureVoz.png", mode = "644" },
    { source = "packaging/icono/png/128.png", dest = "/usr/share/icons/hicolor/128x128/apps/mx.iurefficient.IureVoz.png", mode = "644" },
    { source = "packaging/icono/png/256.png", dest = "/usr/share/icons/hicolor/256x256/apps/mx.iurefficient.IureVoz.png", mode = "644" },
    { source = "packaging/icono/png/512.png", dest = "/usr/share/icons/hicolor/512x512/apps/mx.iurefficient.IureVoz.png", mode = "644" },
    { source = "packaging/icono/iurevoz.svg", dest = "/usr/share/icons/hicolor/scalable/apps/mx.iurefficient.IureVoz.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/iurevoz/README.md", mode = "644", doc = true },
    { source = "LICENSE.md", dest = "/usr/share/licenses/iurevoz/LICENSE.md", mode = "644", doc = true },
]
