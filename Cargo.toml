[package]
name = "iurevoz"
version = "0.1.0"
edition = "2024"
description = "Dictado y órdenes por voz para Linux (GNOME), local; parte de la suite Iurefficient"
license = "Proprietary"
authors = ["Eduardo Llaguno <eduardo@llaguno.com>"]
homepage = "https://github.com/ellaguno/iurevoz"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "global_shortcuts"] }
bzip2 = "0.6.1"
candle-core = "0.11"
candle-nn = "0.11"
chrono = "0.4.45"
# mismo reqwest que iurefficient-connect: para PUT con su `Session::request`
reqwest = { version = "0.12", default-features = false, features = ["json"] }
cpal = "0.18"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
eframe = "0.37"
evalexpr = "13.1.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
iurefficient-connect = { git = "https://github.com/ellaguno/iurefficient-connect", tag = "v0.7.1", version = "0.7.1", default-features = false }
libc = "0.2.191"
rand = "0.10"
rustfft = "6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sherpa-onnx = "1.13.8"
tar = "0.4.46"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1.8"
ureq = { version = "3.4.2", features = ["json"] }
xkbcommon = { version = "0.9.0", default-features = false }
ksni = { version = "0.3", default-features = false, features = ["tokio"] }

# `cargo deb`: paquete para Ubuntu/Debian (los modelos se descargan al primer uso)
[package.metadata.deb]
maintainer = "Eduardo Llaguno <eduardo@llaguno.com>"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """\
IureVoz dicta en cualquier ventana y entiende órdenes por voz. El reconocimiento \
corre en el equipo (Nemotron o Moonshine con sherpa-onnx); las órdenes usan un LLM \
local o el que se configure. Requiere GNOME en Wayland (portal RemoteDesktop)."""
assets = [
    ["target/release/iurevoz", "usr/bin/", "755"],
    ["packaging/mx.iurefficient.IureVoz.desktop", "usr/share/applications/", "644"],
    ["README.md", "usr/share/doc/iurevoz/README.md", "644"],
]
